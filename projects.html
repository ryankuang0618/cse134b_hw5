<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ryan's Portfolio — Projects</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/project-card.js"></script>
</head>
<body>
  <header>
    <div class="container">
      <header-content>
        <h1>Ryan's Portfolio</h1>
        <nav aria-label="Primary">
          <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Toggle navigation menu">
          <label for="nav-toggle" class="hamburger">
            <span></span>
            <span></span>
            <span></span>
          </label>
          <ul class="nav-menu">
            <li><a href="about.html">About Me</a></li>
            <li><a href="projects.html" aria-current="page">Projects</a></li>
            <li><a href="resume.html">Resume</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><button id="theme-toggle" class="theme-toggle">🎨 Themes</button></li>
          </ul>
        </nav>
      </header-content>
    </div>
  </header>

  <main id="content">
    <div class="container">
      <h2 class="fade-in">Projects</h2>

      <section aria-labelledby="data-controls" class="fade-in" style="margin-bottom: 2rem;">
        <h3 id="data-controls" class="sr-only">Load Project Data</h3>
        <div style="display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; align-items: center;">
          <button id="load-local-btn" class="data-load-btn" aria-label="Load projects from local storage">
            📁 Load Local
          </button>
          <button id="load-remote-btn" class="data-load-btn" aria-label="Load projects from remote server">
            🌐 Load Remote
          </button>
          <div id="loading-indicator" style="display: none; color: var(--primary-color); font-weight: 500;">
            <span>Loading projects...</span>
          </div>
        </div>
        <div id="data-status" role="status" aria-live="polite" style="text-align: center; margin-top: 1rem; font-size: 0.875rem; color: var(--secondary-color);"></div>
      </section>

      <div id="projects-container" role="region" aria-label="Projects list">
        <project-card 
        data-title="LoopGen For Runners" 
        data-image="assets/images/loopgen4runners.jpg" 
        data-description="This project builds an adaptive running-music system that predicts a runner’s future speed using physiological data and generates loopable music synchronized to the predicted BPM."
        data-tech="Python, Long Short-Term Memory (LSTM) Network, Regression model"
        data-role="ML Eningeer"
        data-date="2025"
        data-link="https://drive.google.com/file/d/14kR9AzBub-0iHCJIL3JRJKmGDrJDfSXe/view?usp=sharing"
      ></project-card>
      <project-card 
        data-title="Floating Water Exploration Device" 
        data-image="assets/images/floating_device.jpeg" 
        data-description="A device that allows users to explore water bodies by floating on the surface. It is equipped with a camera and a Raspberry Pi to capture images and videos of the water body."
        data-tech="C++, Raspberry Pi"
        data-role="Software Developer"
        data-date="2025"
        data-link="https://docs.google.com/presentation/d/1ML7eFRLy8qpTW09_kd6yoAhq160GsMm1/edit?usp=sharing&ouid=107411627569541652450&rtpof=true&sd=true"
      ></project-card>
      <project-card 
        data-title="UCSD Event Finder Website" 
        data-image="assets/images/event_finder.png" 
        data-description="A website that allows users to find events at UCSD. It is built with TypeScript, JavaScript, HTML, and CSS."
        data-tech="TypeScript, JavaScript, HTML, CSS"
        data-role="Frontend Developer"
        data-date="2025"
        data-link="https://github.com/ryankuang0618/CSE210-Event-Frontend"
      ></project-card>
      <project-card 
        data-title="Smart Glasses" 
        data-image="assets/images/smart_glasses.jpg" 
        data-description="Wearable device with real-time image translation and navigation using Python and GCP."
        data-tech="Python, Firebase, GCP"
        data-role="Full-stack Developer"
        data-date="2019-2020"
        data-link="https://github.com/ryankuang0618/smartglasses_project"
      ></project-card>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <small>&copy; 2025 Ryan Kuang</small>
    </div>
  </footer>

  <div id="theme-modal" class="theme-modal">
    <div class="theme-picker">
      <button id="close-theme-modal" class="close-btn" aria-label="Close theme picker">×</button>
      <h2>Choose Your Theme</h2>
      
      <section class="preset-themes">
        <h3>Quick Themes</h3>
        <div class="theme-buttons">
          <button class="preset-theme" data-theme="light">☀️ Light</button>
          <button class="preset-theme" data-theme="dark">🌙 Dark</button>
          <button class="preset-theme" data-theme="ocean">🌊 Ocean</button>
          <button class="preset-theme" data-theme="forest">🌲 Forest</button>
          <button class="preset-theme" data-theme="sunset">🌅 Sunset</button>
        </div>
      </section>

      <section class="custom-theme">
        <h3>Customize Your Theme</h3>
        
        <div class="theme-option">
          <label for="text-color">Text Color:</label>
          <select id="text-color">
            <option value="very-dark">Very Dark</option>
            <option value="dark">Dark</option>
            <option value="medium">Medium</option>
            <option value="light">Light</option>
            <option value="very-light">Very Light</option>
            <option value="white">White</option>
          </select>
        </div>

        <div class="theme-option">
          <label for="bg-color">Background Color:</label>
          <select id="bg-color">
            <option value="white">White</option>
            <option value="very-light">Very Light</option>
            <option value="light">Light</option>
            <option value="light-sky">Sky Blue</option>
            <option value="light-green">Mint</option>
            <option value="light-orange">Warm</option>
            <option value="medium-dark">Dark Gray</option>
            <option value="very-dark">Very Dark</option>
          </select>
        </div>

        <div class="theme-option">
          <label for="accent-color">Accent Color:</label>
          <select id="accent-color">
            <option value="blue">Blue</option>
            <option value="light-blue">Light Blue</option>
            <option value="green">Green</option>
            <option value="sky">Sky Blue</option>
            <option value="orange">Orange</option>
            <option value="forest">Forest Green</option>
          </select>
        </div>

        <div class="theme-option">
          <label for="font-picker">Font Style:</label>
          <select id="font-picker">
            <option value="system">Modern (Sans-serif)</option>
            <option value="serif">Classic (Serif)</option>
            <option value="mono">Code (Monospace)</option>
          </select>
        </div>

        <div class="theme-actions">
          <button id="apply-theme" class="apply-btn">Apply Custom Theme</button>
          <button id="reset-theme" class="reset-btn">Reset to Light</button>
        </div>
      </section>
    </div>
  </div>

  <script src="js/projects-loader.js"></script>
  <script src="js/theme-picker.js"></script>
  <script src="js/view-transitions.js"></script>
</body>
</html>
